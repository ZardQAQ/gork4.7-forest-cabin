<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>森林小屋</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e7a23a'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%235c3312'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <section id="title-card"></section>
      <div id="dock-wrap">
        <div id="dock" role="toolbar" aria-label="天气"></div>
        <p id="hint">拖拽旋转视角 · 滚轮缩放 · 数字键 1–8 切换天气</p>
      </div>
    </div>
    <script>
      window.addEventListener('error', (event) => {
        const box = document.createElement('pre');
        box.id = 'error';
        box.textContent = event.message || '页面出错';
        document.body.append(box);
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
